[package]
name = "sommelier"
version = "0.3.5-r"
edition = "2021"
description = "sommelier-rs-r: X11-capable Wayland proxy for ChromeOS Crostini"
license = "Apache-2.0"

[dependencies]
nix = { version = "0.31", features = [
    "socket",
    "poll",
    "uio",
    "fs",
    "ioctl",
    "mman",
    "process",
    "signal",
] }
tokio = { version = "1.49", features = ["full"] }
libc = "0.2"
gbm = { version = "0.16", default-features = false, features = ["drm-support"] }
zerocopy = { version = "0.7", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5", features = ["derive", "env"] }
xkbcommon = "0.8.0"
# Pure-Rust X11 protocol implementation for the XWayland window manager.
x11rb = { version = "0.13", features = [
    "composite",
    "xfixes",
    "shape",
    "randr",
    "render",
] }

[build-dependencies]
wayland_codegen = { path = "../wayland_codegen" }

[[bin]]
name = "sommelier-rs-r"
path = "src/main.rs"
