name: sommelier-rs-r Release (Debian 13)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (must match sommelier/Cargo.toml)'
        required: true

permissions:
  contents: write

# The installable artifact is a .deb built by packaging/build-deb.sh -- the
# same script documented in docs/CROSTINI_INSTALL.md. Cross-compiling and
# running the test suite for both architectures stays in ci-debian.yaml.
jobs:
  build-deb:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie-slim

    steps:
      - name: Install build dependencies
        run: |
          apt-get update && apt-get -y install \
            build-essential \
            curl \
            git \
            pkg-config \
            dpkg-dev \
            libxkbcommon-dev \
            libgbm-dev \
            libdrm-dev \
            libexpat1-dev

      - uses: actions/checkout@v6

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Verify version matches Cargo.toml
        run: |
          CARGO_VERSION=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' sommelier/Cargo.toml | head -n 1)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_VERSION="${{ github.event.inputs.version }}"
            echo "RELEASE_TAG=v${RELEASE_VERSION}" >> "$GITHUB_ENV"
          else
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi
          echo "Cargo.toml: ${CARGO_VERSION} / release: ${RELEASE_VERSION}"
          if [ "${CARGO_VERSION}" != "${RELEASE_VERSION}" ]; then
            echo "::error::Version mismatch: Cargo.toml says ${CARGO_VERSION}, release says ${RELEASE_VERSION}."
            exit 1
          fi

      - name: Build Debian package
        run: bash packaging/build-deb.sh

      - name: Upload .deb to GitHub Release
        uses: softprops/action-gh-release@v2.6.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*.deb
          draft: false
          prerelease: false
